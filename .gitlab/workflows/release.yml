bump:
  stage: release
  tags:
    - k8s
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == "main"'
      variables:
        BUMP_ARGS: --auto
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == "nightly"'
      variables:
        BUMP_ARGS: --auto --pre
  image: rust:latest
  resource_group: release
  variables:
    COG_VERSION: 7.0.0
    COG_TARGET: x86_64-unknown-linux-musl
    CARGO_HOME: $CI_PROJECT_DIR/.cargo
    GIT_DEPTH: 0
  cache:
    key:
      files:
        - Cargo.lock
    paths:
      - .cargo/
    policy: pull
  before_script:
    - curl -sSfL "https://github.com/cocogitto/cocogitto/releases/download/${COG_VERSION}/cocogitto-${COG_VERSION}-${COG_TARGET}.tar.gz" | tar -xz -C /usr/local/bin --strip-components=1 "${COG_TARGET}/cog"
    - git remote set-url origin "https://oauth2:${GITLAB_TOKEN}@gitlab.digitalventura.com.br/luadot/luadot.git"
    - git fetch origin --tags --force
    - git checkout -B "$CI_COMMIT_BRANCH" "$CI_COMMIT_SHA"
    - git config user.name "$GITLAB_USER_NAME"
    - git config user.email "$GITLAB_USER_EMAIL"
  script:
    - cog bump $BUMP_ARGS --skip-ci
    - git push -o ci.skip origin "$CI_COMMIT_BRANCH"
    - git push -o ci.skip origin --tags
    - echo "LUADOT_TAG=$(git describe --tags --exact-match HEAD)" > bump.env
  artifacts:
    reports:
      dotenv: bump.env
